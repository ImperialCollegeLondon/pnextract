[build-system]
requires = [
    "cmake>=3.31.10,<4",
    "setuptools>=84",
    "setuptools-scm[simple]>=10.2.3,<11",
]
build-backend = "setuptools.build_meta"

[project]
name = "pnextract"
dynamic = ["version"]
license = "MIT"
description = "Pore network extraction from micro-CT images of porous media"
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.6"

[project.scripts]
pnextract = "pnextract.__main__:pnextract"
voxelImageProcess = "pnextract.__main__:voxel_image_process"

[project.urls]
Repository = "https://github.com/lmmp-puc-rio/pnextract"

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["pnextract"]
